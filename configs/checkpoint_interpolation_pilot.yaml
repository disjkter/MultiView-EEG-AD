experiment:
  name: checkpoint_interpolation_pilot
  seeds: [2026, 2027, 2028]
  supports_per_class: [4, 8]
  interpolation_weights: [0.25, 0.50, 0.75]
  output_root: outputs/jbhi_revision/checkpoint_interpolation_pilot
  reference_root: outputs/jbhi_revision/staged_ds004504_to_caueeg

data:
  target: CAUEEG_processed_19ch_ad_vs_hc_1s_lead
  target_split_patterns:
    "4": outputs/caueeg_support4_splits/CAUEEG_seed{seed}.json
    "8": outputs/caueeg_support_curve_splits/support8_seed{seed}/CAUEEG_seed{seed}.json

checkpoints:
  ssl: checkpoints/jbhi_revision_full.pth
  source_pattern: outputs/jbhi_revision/staged_ds004504_to_caueeg/source_ds004504/seed_{seed}/best_model.pth

target_training:
  epochs: 30
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 8
  max_train_segments_per_subject: 20
  max_val_segments_per_subject: 100
  max_test_segments_per_subject: 100

evaluation:
  alignment: euclidean
  max_alignment_samples: 5000
  selection_metric: auc
  tune_threshold: true
  threshold_objective: balanced_acc

