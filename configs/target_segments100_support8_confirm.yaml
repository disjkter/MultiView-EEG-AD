experiment:
  name: target_segments100_support8_confirm
  completed_pilot_seeds: [2026, 2027, 2028]
  confirmation_seeds: [2029, 2030, 2031, 2032, 2033, 2034, 2035]
  all_seeds: [2026, 2027, 2028, 2029, 2030, 2031, 2032, 2033, 2034, 2035]
  support_per_class: 8
  train_segments_per_subject: 100
  output_root: outputs/jbhi_revision/target_segments100_support8_confirm
  pilot_root: outputs/jbhi_revision/target_segment_budget_pilot
  reference_root: outputs/jbhi_revision/staged_ds004504_to_caueeg

data:
  target: CAUEEG_processed_19ch_ad_vs_hc_1s_lead
  split_pattern: outputs/caueeg_support_curve_splits/support8_seed{seed}/CAUEEG_seed{seed}.json

initialization:
  ssl_checkpoint: checkpoints/jbhi_revision_full.pth

training:
  epochs: 30
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 8
  max_val_segments_per_subject: 100
  max_test_segments_per_subject: 100

evaluation:
  alignment: euclidean
  max_alignment_samples: 5000
  selection_metric: auc
  tune_threshold: true
  threshold_objective: balanced_acc

