experiment:
  name: l2sp_stage2_pilot
  seeds: [2026, 2027, 2028]
  supports_per_class: [4, 8]
  output_root: outputs/jbhi_revision/l2sp_stage2_pilot
  reference_root: outputs/jbhi_revision/staged_ds004504_to_caueeg

data:
  source: ds004504_processed_19ch_1s_lead
  target: CAUEEG_processed_19ch_ad_vs_hc_1s_lead
  source_split_pattern: outputs/jbhi_revision/locked_splits_65/ds004504_processed_19ch_1s_lead_seed{seed}.json
  target_split_patterns:
    "4": outputs/caueeg_support4_splits/CAUEEG_seed{seed}.json
    "8": outputs/caueeg_support_curve_splits/support8_seed{seed}/CAUEEG_seed{seed}.json

initialization:
  ssl_checkpoint: checkpoints/jbhi_revision_full.pth
  stage2_variants:
    - name: stage2_low_lr
      encoder_learning_rate: 0.0001
      l2sp_weight: 0.0
    - name: stage2_l2sp_1e4
      encoder_learning_rate: 0.0001
      l2sp_weight: 0.0001
    - name: stage2_l2sp_1e3
      encoder_learning_rate: 0.0001
      l2sp_weight: 0.001

source_training:
  epochs: 20
  batch_size: 32
  classifier_learning_rate: 0.001
  weight_decay: 0.0001
  patience: 5
  max_train_segments_per_subject: 250
  max_val_segments_per_subject: 250
  max_test_segments_per_subject: 400

target_training:
  epochs: 30
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 8
  max_train_segments_per_subject: 20
  max_val_segments_per_subject: 100
  max_test_segments_per_subject: 100

evaluation:
  alignment: euclidean
  max_alignment_samples: 5000
  selection_metric: auc
  tune_threshold: true
  threshold_objective: balanced_acc

