targets:
  - name: CAUEEG
    data_dir: CAUEEG_processed_19ch_ad_vs_hc_1s_lead
    split_file: outputs/subject_splits/CAUEEG_processed_19ch_ad_vs_hc_1s_lead_seed2026.json
  - name: ds004504
