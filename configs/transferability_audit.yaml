gradient_batches: 4
batch_size: 64
seed: 2026
device: auto
output_prefix: outputs/transferability_audit/seed2026

source_training:
  epochs: 50
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 8
  max_segments_per_subject: 100
  graph_out_dim: 256
  temporal_out_dim: 256
  graph_num_neighbors: 4
  classifier_dropout: 0.6
