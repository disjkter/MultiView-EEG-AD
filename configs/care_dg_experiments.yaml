experiment_name: care_dg

domains:
  CAUEEG: CAUEEG_processed_19ch_ad_vs_hc_1s_lead
  ds004504: ds004504_processed_19ch_1s_v2
  ADSZ: ADSZ_processed_19ch_1s_v3
  ADFSU: ADFSU_processed_19ch_1s_v2

common:
  epochs: 30
  batch_size: 32
  lr: 0.001
  weight_decay: 0.0001
  patience: 8
  max_source_subjects_per_class: 50
  max_segments_per_subject: 20
  max_target_segments_per_subject: 20
  threshold_objective: balanced_acc
  domain_balanced_batches: true
  tune_threshold: true
  care_calibration_bandwidth: 0.1
  care_calibration_equalization_weight: 1.0

backbones:
  graph_temporal: {}
  eegnet:
    disease_dim: 64
    domain_dim: 32

variants:
  care_dg:
    lambda_care_score: 0.05
    lambda_care_calibration: 0.5
    lambda_care_entropy: 0.05
  care_no_score:
    lambda_care_score: 0.0
    lambda_care_calibration: 0.5
    lambda_care_entropy: 0.05
  care_no_calibration:
    lambda_care_score: 0.05
    lambda_care_calibration: 0.0
    lambda_care_entropy: 0.05
  care_no_entropy:
    lambda_care_score: 0.05
    lambda_care_calibration: 0.5
    lambda_care_entropy: 0.0
  pooled_mmce:
    lambda_care_score: 0.0
    lambda_care_calibration: 0.5
    lambda_care_entropy: 0.0
    care_calibration_equalization_weight: 0.0
  multidomain_calibration:
    lambda_care_score: 0.0
    lambda_care_calibration: 0.5
    lambda_care_entropy: 0.0
    care_calibration_equalization_weight: 1.0

stages:
  screening:
    domains: [CAUEEG, ds004504, ADSZ]
    targets: [CAUEEG, ds004504, ADSZ]
    backbones: [graph_temporal]
    variants: [care_dg, care_no_score, care_no_calibration, care_no_entropy, pooled_mmce, multidomain_calibration]
    seeds: [2026, 2027, 2028]
    output_root: outputs/care_dg_screening
  development:
    domains: [CAUEEG, ds004504, ADSZ]
    targets: [CAUEEG, ds004504, ADSZ]
    backbones: [graph_temporal, eegnet]
    variants: [care_dg]
    seeds: [2026, 2027, 2028, 2029, 2030, 2031, 2032, 2033, 2034, 2035]
    output_root: outputs/care_dg_development
  ablation:
    domains: [CAUEEG, ds004504, ADSZ]
    targets: [CAUEEG, ds004504, ADSZ]
    backbones: [graph_temporal]
    variants: [care_dg, care_no_score, care_no_calibration, care_no_entropy]
    seeds: [2026, 2027, 2028, 2029, 2030, 2031, 2032, 2033, 2034, 2035]
    output_root: outputs/care_dg_ablation
  confirmation:
    domains: [CAUEEG, ds004504, ADSZ, ADFSU]
    targets: [ADFSU]
    backbones: [graph_temporal, eegnet]
    variants: [care_dg]
    seeds: [2026, 2027, 2028, 2029, 2030, 2031, 2032, 2033, 2034, 2035]
    output_root: outputs/care_dg_adfsu_confirmation
