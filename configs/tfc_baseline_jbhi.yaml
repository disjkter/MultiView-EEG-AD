# External TF-C baseline used for the JBHI revision.
epochs: 50
batch_size: 64
lr: 0.001
weight_decay: 0.0001
temperature: 0.2
within_domain_weight: 0.2
jitter_std: 0.02
frequency_remove_ratio: 0.1
frequency_add_ratio: 0.1
model_dim: 128
projection_dim: 128
num_layers: 2
num_heads: 4
dropout: 0.1
seed: 2026

# Downstream settings consumed by run_dual_stream_subject_split.py.
model_type: tfc
tfc_model_dim: 128
tfc_projection_dim: 128
tfc_num_layers: 2
tfc_num_heads: 4
classifier_dropout: 0.6
patience: 5
use_ea: true
tune_threshold: true
threshold_objective: balanced_acc
selection_metric: auc
