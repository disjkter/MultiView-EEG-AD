# Matched protocol for the staged-transfer ablation reported in the paper.
epochs: 20
batch_size: 32
lr: 0.001
weight_decay: 0.0001
patience: 5
use_ea: true
disable_class_weights: false
loss_type: ce
tune_threshold: true
threshold_objective: balanced_acc
selection_metric: auc
model_type: dual_stream
spatial_out_dim: 256
temporal_out_dim: 256
spatial_hidden_channels: 64
spatial_temporal_channels: 128
classifier_num_layers: 2
classifier_dropout: 0.6
use_neuro_prior: false
augment_train: false
