data_module:
  _target_: 'data_module.finetune_data_module.FinetuneDataModule'
  name: "eeg-data"
  cfg:
    num_workers: ${num_workers}
    batch_size: ${batch_size}
  test: null
  train_val_split_ratio: 0.8
  
  datasets:
    eeg_data:
      _target_: 'datasets.hdf5_dataset.HDF5Loader'
      finetune: True  # Set to True if this is for fine-tuning, False for pre-training
      hdf5_file: "${oc.env:DATA_PATH}/eeg-data_data/train.h5"
      
    eeg_data_val:
      _target_: 'datasets.hdf5_dataset.HDF5Loader'
      finetune: True  # Set to True if this is for fine-tuning, False for pre-training
      hdf5_file: "${oc.env:DATA_PATH}/eeg-data_data/val.h5"
      
    eeg_data_test:
      _target_: 'datasets.hdf5_dataset.HDF5Loader'
      finetune: True  # Set to True if this is for fine-tuning, False for pre-training
      hdf5_file: "${oc.env:DATA_PATH}/eeg-data_data/test.h5"