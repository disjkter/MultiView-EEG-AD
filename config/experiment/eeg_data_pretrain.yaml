# Experiment for pre-training with eeg-data dataset

defaults:
  - override /data_module: eeg_data_module
  - override /task: pretrain_task
  - override /scheduler: multi_step_lr
  - override /model: FEMBA_pretrain
  - override /criterion: pretrain_criterion

# Set to pre-training mode
training: True
pretrained_checkpoint: null
load_state_dict: False

# Training parameters
trainer:
  max_epochs: 200
  val_check_interval: 1.0  # Validate once per epoch
  check_val_every_n_epoch: 1

optimizer:
  optim: LAMB
  lr: 1e-4

# Model checkpoint settings
model_checkpoint:
  save_last: True
  save_top_k: 3
  monitor: "val_recon_loss"
  mode: "min"