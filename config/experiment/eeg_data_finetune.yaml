# Experiment for fine-tuning with eeg-data dataset

defaults:
  - override /data_module: eeg_data_module
  - override /task: finetune_task
  - override /scheduler: cosine
  - override /model: FEMBA_finetune
  - override /criterion: finetune_criterion

# Set to fine-tuning mode
training: True
pretrained_checkpoint: null  # Path to pre-trained checkpoint if you have one
load_state_dict: False

# Training parameters
trainer:
  max_epochs: 100
  val_check_interval: 0.5  # Validate twice per epoch
  check_val_every_n_epoch: 1

optimizer:
  optim: LAMB
  lr: 3e-4  # Lower learning rate for fine-tuning

# Model checkpoint settings
model_checkpoint:
  save_last: True
  save_top_k: 5
  monitor: "val_loss"
  mode: "min"