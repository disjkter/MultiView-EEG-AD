# 多疾病EEG分类实验配置 - 基于您的数据结构调整
tag: multi_disease_classification
model_size: base
gpus: 1
num_nodes: 1
num_workers: 4
batch_size: 16

# 训练控制
final_validate: True
final_test: True
resume: False
pretrained_checkpoint_path: null

# 基础配置
defaults:
  - override /data_module: eeg_data_module
  - override /model: LUNA_base
  - override /scheduler: cosine
  - override /task: finetune_task_LUNA
  - override /criterion: finetune_criterion

# 模型配置 - 适配您的19通道数据
model:
  drop_path: 0.1
  num_classes: 7  # 健康 + 6种疾病类别
  use_channel_unification: true
  num_channels: 19  # 您的数据是19通道
  seq_length: 1280  # 5秒 @ 256Hz

# 数据模块配置
data_module:
  name: "model"  # 对应 model-data 目录
  cfg:
    batch_size: ${batch_size}
    num_workers: ${num_workers}
  test: True
  train_val_split_ratio: 0.8

# 任务配置
task:
  masking:
    patch_size: [4, 32]  # 适配19通道
    masking_ratio: 0.4
    unmasked_loss_coeff: 0.1
  classification_type: "multi_disease"

# 优化器配置
optimizer:
  optim: 'AdamW'
  lr: 1e-4
  weight_decay: 0.05
  betas: [0.9, 0.98]

# 学习率调度器
scheduler:
  min_lr: 1e-6
  warmup_lr_init: 1e-6
  warmup_epochs: 5

# 训练器配置
trainer:
  accelerator: gpu
  devices: ${gpus}
  max_epochs: 100
  precision: 16
  gradient_clip_val: 1.0
  accumulate_grad_batches: 2
  check_val_every_n_epoch: 1

# 模型检查点
model_checkpoint:
  save_last: True
  monitor: "val_f1_score"
  mode: "max"
  save_top_k: 3
  filename: "multi-disease-{epoch:02d}-{val_f1_score:.4f}"

# 疾病类别映射（根据您的数据调整）
disease_mapping:
  healthy: 0
  epilepsy: 1
  adhd: 2
  autism: 3
  alzheimer: 4
  parkinson: 5
  depression: 6

# 评估指标
metrics:
  - accuracy
  - f1_score
  - precision
  - recall
  - auc_roc

# 数据预处理配置
data_preprocessing:
  normalize: true
  standardize: true
  sampling_rate: 256  # 您的数据采样率
  segment_length: 1280  # 5秒的数据点数
  num_channels: 19      # 您的数据通道数