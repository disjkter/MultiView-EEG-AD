# 为 eeg-data 数据集配置的实验配置文件

_target_: tasks.multi_disease_task.MultiDiseaseClassificationTask

# 数据模块配置
data_module:
  _target_: data_module.finetune_data_module.FinetuneDataModule
  cfg:
    batch_size: 16
    num_workers: 4
  train:
    _target_: datasets.hdf5_dataset.HDF5Loader
    hdf5_file: model-data/train.h5
    squeeze: false
    finetune: true
    cache_size: 1500
    use_cache: true
  val:
    _target_: datasets.hdf5_dataset.HDF5Loader
    hdf5_file: model-data/val.h5
    squeeze: false
    finetune: true
    cache_size: 500
    use_cache: true
  test:
    _target_: datasets.hdf5_dataset.HDF5Loader
    hdf5_file: model-data/test.h5
    squeeze: false
    finetune: true
    cache_size: 500
    use_cache: true

# 模型配置
model:
  _target_: models.LUNA.LUNA
  num_channels: 19  # eeg-data 中的通道数
  num_classes: 3  # Alzheimer, FTD, Healthy
  hidden_dim: 256
  embed_dim: 256
  num_heads: 8
  num_layers: 4
  dropout: 0.1
  mlp_ratio: 4
  patch_size: 16
  num_patches: 80  # 1280 / 16 = 80

# 任务配置
task:
  _target_: tasks.finetune_task_LUNA.FinetuneTask
  classification_type: mcc  # Multi-Class Classification
  input_normalization:
    normalize: true

# 优化器配置
optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-3
  betas: [0.9, 0.999]
  weight_decay: 1e-5

# 学习率调度器
scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingWarmRestarts
  T_0: 50
  T_mult: 1
  eta_min: 1e-6

# 训练器配置
trainer:
  max_epochs: 100
  num_nodes: 1
  devices: 1
  accelerator: gpu
  strategy: auto
  enable_progress_bar: true
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
  
callbacks:
  model_checkpoint:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    dirpath: checkpoints/eeg_data_classification
    filename: eeg-data-{epoch:02d}-{val_f1_score:.4f}
    monitor: val_f1_score
    mode: max
    save_top_k: 3
    save_last: true
  early_stopping:
    _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: val_loss
    patience: 20
    mode: min
    verbose: true

# 损失函数
criterion:
  _target_: torch.nn.CrossEntropyLoss
  weight: null  # 可以根据类别不平衡设置权重

# 其他配置
seed: 42
tag: eeg_data_classification

io:
  base_output_path: tb_logs
